name: Release APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Version name shown to users (for example 1.0.0)
        required: true
        type: string
      version_code:
        description: Integer version code for Android updates
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      ANDROID_VERSION_NAME: ${{ inputs.version_name || github.ref_name }}
      ANDROID_VERSION_CODE: ${{ inputs.version_code || github.run_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Validate release secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Missing KEYSTORE_BASE64"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "Missing KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing KEY_PASSWORD"; exit 1; }
          test -n "$GOOGLE_SERVICES_JSON" || { echo "Missing GOOGLE_SERVICES_JSON"; exit 1; }

      - name: Prepare signing and Firebase configuration
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/quimia-release.jks"
          {
            printf 'storeFile=%s\n' "$RUNNER_TEMP/quimia-release.jks"
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > keystore.properties
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          chmod 600 keystore.properties app/google-services.json "$RUNNER_TEMP/quimia-release.jks"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew clean assembleRelease --no-daemon --stacktrace --console=plain

      - name: Verify APK signature
        run: |
          apksigner_path=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          "$apksigner_path" verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: quimia-release-${{ env.ANDROID_VERSION_NAME }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            app/build/outputs/apk/release/app-release.apk \
            --title "Quimia $GITHUB_REF_NAME" \
            --generate-notes
