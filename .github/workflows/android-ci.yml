name: Android CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "fix/**"
      - "refactor/**"
      - "ci/**"
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run unit tests and lint
        run: |
          set -o pipefail
          set +e
          ./gradlew test lint --no-daemon --stacktrace --console=plain 2>&1 | tee gradle-ci.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "### Gradle failure output" >> "$GITHUB_STEP_SUMMARY"
            grep -Ei '(^e:|FAILURE:|What went wrong|Execution failed|error:|Unresolved reference|Caused by:|issues were found|Dependency|requires|compileSdk|minCompileSdk|currently|AAR metadata)' gradle-ci.log | head -n 60 >> "$GITHUB_STEP_SUMMARY" || true
            while IFS= read -r line; do
              echo "::error::$line"
            done < <(grep -Ei '(^e:|FAILURE:|What went wrong|Execution failed|error:|Unresolved reference|Caused by:|issues were found|Dependency|requires|compileSdk|minCompileSdk|currently|AAR metadata)' gradle-ci.log | head -n 60)
            exit "$status"
          fi

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: quimia-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-ci-reports
          path: |
            **/build/reports/**
            **/build/test-results/**
            gradle-ci.log
          if-no-files-found: ignore
          retention-days: 7
